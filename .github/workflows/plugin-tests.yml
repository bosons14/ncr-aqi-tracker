name: plugin tests
on:
  push:
    paths: ["plugin/**", "index.html", "data/**", ".github/workflows/plugin-tests.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s plugin/tests -v
      - run: pip install "mcp>=1.2,<3" && python -c "import sys; sys.path.insert(0,'plugin/server'); import aqi_mcp"
